<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
    <div class="header">
    <img src="./img/facebook.png" alt="facebok icon">
    </div>
    <hr class="line">
    <form>
        <p id="log">Log in to Facebook</p>
        <div class="item">
            <input type="text" placeholder="Email address or mobile number">
        </div>
        <br>
        <div class="item">
            <input type="password" placeholder="Password">
        </div>
        <br>
        <div class="item">
            <button type="submit" class="login">Login</button>
        </div>
        <br>
        <div class="item">
            <button class="fp">Forgotten password? </button>
        </div>
        <br>
        <div class="item">
            <button class="cna"> Create new account</button>
        </div>
        <div class="item">
            <img src="" alt="" >
        </div>
    </form>

</div>
</body>
</html>
